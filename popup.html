<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>PIC TO PDF</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="brand">
    <span class="brand-logo"><img src="icon128.png" alt=""></span>
    <div class="brand-text">
      <h1>PIC TO PDF</h1>
      <p>کمیک را به PDF یا تصویر تبدیل کن</p>
    </div>
    <span class="version-pill">v2.31</span>
  </div>

  <div class="field">
    <label>روش جمع‌آوری تصاویر</label>
    <div class="mode-seg" id="modeSeg" role="group" aria-label="روش جمع‌آوری تصاویر">
      <button type="button" class="mode-btn active" data-mode="scroll" title="اسکرول خودکار تا انتهای صفحه؛ مناسب کمیک و وب‌تون تودرتو">اسکرول صفحه</button>
      <button type="button" class="mode-btn" data-mode="auto" title="خود افزونه روی مثلث یا دکمهٔ صفحهٔ بعدی کلیک می‌کند؛ مناسب کتاب‌های صفحه‌ای مثل Google Books">ورق‌زدن خودکار</button>
      <button type="button" class="mode-btn" data-mode="manual" title="خودت روی صفحهٔ بعدی کلیک می‌کنی و افزونه هر تصویر تازه را خودش برمی‌دارد؛ با دکمهٔ «تمام شد» پایان می‌دهی">ورق‌زدن دستی</button>
    </div>
    <p class="mode-hint">اسکرول برای کمیک‌های تودرتو؛ ورق‌زدن برای سایت‌های صفحه‌ای که با کلیک روی مثلث عوض می‌شوند.</p>
  </div>

  <div class="field">
    <label for="pdfName">نام فایل خروجی</label>
    <input type="text" id="pdfName" value="comic" spellcheck="false">
  </div>

  <div class="box hidden" id="statusBox">
    <div id="statusText"></div>
  </div>

  <button id="startBtn" class="btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>
    <span>شروع و پیش‌نمایش تصاویر</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
