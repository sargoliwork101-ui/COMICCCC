[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comic-ocr-studio"
version = "3.0.3"
description = "Standalone local OCR, translation and comic editing studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "Pillow>=11,<13",
  "PyMuPDF>=1.24,<2",
  "numpy>=2,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
ocr = [
  "rapidocr>=3.10,<3.11",
  "onnxruntime>=1.20,<2",
]
easyocr = [
  "easyocr>=1.7,<2",
  "torch>=2.2,<3",
]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
comic-ocr-studio = "comic_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["comic_studio*"]

[tool.setuptools.package-data]
comic_studio = ["static/**/*", "static/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "real_ocr: opt-in test that loads a real local OCR model",
]
